name: Bot de fotos (miniaturas)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bot de cardapios"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  fotos:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Baixar miniaturas das fotos aprovadas
        run: python coletar_fotos.py
      - name: Commitar fotos
        if: always()
        run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add data/fotos
          git diff --cached --quiet && { echo "sem mudanças"; exit 0; }
          git commit -m "dados: fotos $(date -u +%F)"
          git pull --rebase origin main
          git push
