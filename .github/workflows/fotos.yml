name: Bot de fotos (miniaturas)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Bot de cardapios"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  fotos:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"            # painel de bots: publica o progresso no branch bot-status
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Baixar miniaturas das fotos aprovadas
        run: python coletar_fotos.py
      - name: Commitar dados
        if: always()
        run: |
          scripts/commitar_dados.sh "dados: fotos $(date -u +%F)" data/fotos
