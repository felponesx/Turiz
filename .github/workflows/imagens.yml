name: Bot de imagens
on:
  workflow_run:
    workflows: ["Bot de enderecos"]
    types: [completed]
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes (commons site)"
        default: "commons site"
      limite_sites:
        description: "Máximo de sites a visitar (vazio = todos)"
        default: ""
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  imagens:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Coletar imagens
        run: |
          python coletar_imagens.py ${{ inputs.fontes || 'commons site' }} ${{ inputs.limite_sites && format('--limite-sites {0}', inputs.limite_sites) || '' }}
      - name: Commitar dados
        run: |
          git config user.name "imagens-bot"
          git config user.email "imagens-bot@users.noreply.github.com"
          git add data/imagens.json
          git diff --cached --quiet && { echo "sem mudanças"; exit 0; }
          git commit -m "dados: imagens $(date -u +%F)"
          git pull --rebase origin main
          git push
