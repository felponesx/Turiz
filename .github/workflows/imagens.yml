name: Bot de imagens
on:
  workflow_run:
    workflows: ["Bot de enderecos"]
    types: [completed]
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes (commons site)"
        default: "commons site"
      limite_sites:
        description: "Máximo de sites a visitar (vazio = todos)"
        default: ""
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  imagens:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"            # painel de bots: publica o progresso no branch bot-status
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Coletar imagens
        run: |
          python coletar_imagens.py ${{ inputs.fontes || 'commons site' }} ${{ inputs.limite_sites && format('--limite-sites {0}', inputs.limite_sites) || '' }}
      - name: Commitar dados
        if: always()
        run: |
          scripts/commitar_dados.sh "dados: imagens $(date -u +%F)" data/imagens.json
