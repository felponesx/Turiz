name: Bot de enderecos
on:
  workflow_dispatch:
    inputs:
      max_minutos:
        description: "Tempo máximo da execução em minutos"
        default: "150"
permissions:
  contents: write
jobs:
  enderecos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Completar enderecos
        run: python coletar_enderecos.py --max-minutos ${{ inputs.max_minutos || '150' }}
      - name: Commitar dados
        if: always()
        run: |
          git config user.name "enderecos-bot"
          git config user.email "enderecos-bot@users.noreply.github.com"
          git add data/lugares.json data/eventos.json
          git diff --cached --quiet && { echo "sem mudanças"; exit 0; }
          git commit -m "dados: enderecos completados $(date -u +%F)"
          git pull --rebase origin main
          git push
