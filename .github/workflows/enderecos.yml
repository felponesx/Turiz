name: Bot de enderecos
on:
  workflow_dispatch:
    inputs:
      encadear:
        description: "Disparar o próximo bot da cadeia ao terminar (o Core passa false)"
        default: "true"
      max_minutos:
        description: "Tempo máximo da execução em minutos"
        default: "150"
permissions:
  contents: write
  actions: write      # para disparar o próximo bot da cadeia
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  enderecos:
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"            # painel de bots: publica o progresso no branch bot-status
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Completar enderecos
        run: python coletar_enderecos.py --max-minutos ${{ inputs.max_minutos || '150' }}
      - name: Commitar dados
        if: always()
        run: |
          scripts/commitar_dados.sh "dados: enderecos completados $(date -u +%F)" data/lugares.json data/eventos.json
      - name: Disparar o próximo bot da cadeia (imagens)
        if: always() && !cancelled() && inputs.encadear != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run imagens.yml --ref main || echo "não consegui disparar o próximo bot"
