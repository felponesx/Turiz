name: Bot do Google Places
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  google:
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restaurar banco a partir do snapshot
        run: python restaurar.py
      - name: Coletar do Google Places (sem a chave, o bot só avisa no painel)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python coletar.py google
      - name: Commitar dados
        if: always()
        run: |
          scripts/commitar_dados.sh "dados: google places $(date -u +%F)" data/lugares.json data/eventos.json data/eventos_v2.json.gz
