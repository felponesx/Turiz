name: TURIZ Core (despachante)
on:
  schedule:
    - cron: "*/10 * * * *"      # um ciclo a cada 10 min: reconcilia, agenda e dispara tarefas
  workflow_dispatch:
    inputs:
      comando:
        description: "Comando do painel (JSON validado pelo Core). Vazio = só um ciclo"
        default: ""
permissions:
  contents: write               # grava o estado no branch bot-control
  actions: write                # inicia/cancela execuções dos bots
concurrency:
  group: nucleo
  cancel-in-progress: false
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - name: Ciclo do Core
        env:
          TURIZ_COMANDO: ${{ inputs.comando }}      # via variável de ambiente (nunca interpolado no shell)
        run: python -m core.despachante
