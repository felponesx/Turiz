name: Vendor do front (fontes e jsQR locais, com hash)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - run: python frontend/vendor_baixar.py
      - name: Commitar
        run: |
          git config user.name "vendor-bot"
          git config user.email "vendor-bot@users.noreply.github.com"
          git add frontend/vendor
          git diff --cached --quiet && exit 0
          git commit -m "front: vendor de fontes e jsQR com integridade"
          git pull --rebase origin main
          git push
