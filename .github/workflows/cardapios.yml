name: Bot de cardapios
on:
  workflow_dispatch:
    inputs:
      encadear:
        description: "Disparar o próximo bot da cadeia ao terminar (o Core passa false)"
        default: "true"
      limite_sites:
        description: "Máximo de sites a visitar (vazio = todos)"
        default: ""
permissions:
  contents: write
  actions: write      # para disparar o próximo bot da cadeia
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  cardapios:
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"            # painel de bots: publica o progresso no branch bot-status
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Buscar cardápios oficiais
        run: python coletar_cardapios.py ${{ inputs.limite_sites && format('--limite-sites {0}', inputs.limite_sites) || '' }}
      - name: Commitar dados
        if: always()
        run: |
          scripts/commitar_dados.sh "dados: cardapios $(date -u +%F)" data/cardapios.json
      - name: Disparar o próximo bot da cadeia (fotos)
        if: always() && !cancelled() && inputs.encadear != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fotos.yml --ref main || echo "não consegui disparar o próximo bot"
