name: Coleta agendada
on:
  schedule:
    - cron: "0 6 * * 1"   # segundas, 06:00 UTC
  workflow_dispatch:
    inputs:
      fontes:
        description: "Fontes (osm google eventbrite sites)"
        default: "osm sites"
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restaurar banco anterior a partir do snapshot
        run: python restaurar.py
      - name: Coletar
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: python coletar.py ${{ inputs.fontes || 'osm sites' }}
      - name: Commitar dados
        run: |
          git config user.name "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "dados: coleta $(date -u +%F)"
          git push
