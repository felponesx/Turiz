name: Coleta agendada
on:
  schedule:
    - cron: "0 6 * * 1"   # segundas, 06:00 UTC
  workflow_dispatch:
    inputs:
      encadear:
        description: "Disparar o próximo bot da cadeia ao terminar (o Core passa false)"
        default: "true"
      fontes:
        description: "Fontes (osm google eventbrite sites ticketmaster)"
        default: "osm sites ticketmaster"
permissions:
  contents: write
  actions: write      # para disparar o próximo bot da cadeia
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"            # painel de bots: publica o progresso no branch bot-status
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Restaurar banco anterior a partir do snapshot
        run: python restaurar.py
      - name: Coletar
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python coletar.py ${{ inputs.fontes || 'osm sites ticketmaster' }}
      - name: Commitar dados
        run: |
          scripts/commitar_dados.sh "dados: coleta $(date -u +%F)" data/
      - name: Disparar o próximo bot da cadeia (enderecos)
        if: always() && !cancelled() && inputs.encadear != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run enderecos.yml --ref main || echo "não consegui disparar o próximo bot"
