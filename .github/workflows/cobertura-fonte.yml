name: Cobertura - baixar distritos (IBGE)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  distritos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/baixar_distritos.py
      - run: |
          scripts/commitar_dados.sh "dados: distritos de São Paulo (IBGE)" data/geo/distritos_sp.json.gz
