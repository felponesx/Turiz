name: Fotos ilustrativas (exemplo)
on:
  workflow_dispatch:
    inputs:
      temas:
        description: "Temas para refazer (vazio = todos)"
        default: ""
permissions:
  contents: write
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    env:
      TURIZ_STATUS_PUBLICAR: "1"            # painel de bots: publica o progresso no branch bot-status
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python coletar_fotos_exemplo.py --por-tema 5 ${{ inputs.temas && format('--temas {0}', inputs.temas) || '' }}
      - name: Commitar dados
        if: always()
        run: |
          scripts/commitar_dados.sh "dados: fotos ilustrativas $(date -u +%F)" data/fotos_exemplo
