[alembic]
script_location = migracoes
# a URL do banco vem de DATABASE_URL (migracoes/env.py usa app.db.engine); nada de credenciais aqui

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
